<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Orientador Tech · Vista móvil</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      align-items: center;
      background: #e8eee9;
      color: #17221d;
      display: flex;
      flex-direction: column;
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      gap: 16px;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .caption { color: #506158; font-size: 13px; font-weight: 650; }
    .device {
      background: #111714;
      border: 1px solid #17221d;
      border-radius: 32px;
      box-shadow: 0 18px 60px #19251c26;
      height: min(844px, calc(100vh - 90px));
      max-height: 844px;
      overflow: hidden;
      padding: 8px;
      width: 406px;
    }
    iframe { background: #eef2ee; border: 0; border-radius: 25px; display: block; height: 100%; width: 100%; }
    @media (max-width: 460px) {
      body { background: #eef2ee; justify-content: flex-start; padding: 10px 0 0; }
      .caption { align-self: center; }
      .device { border: 0; border-radius: 0; box-shadow: none; height: calc(100vh - 43px); padding: 0; width: 100%; }
      iframe { border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="caption">Vista móvil · 390 × 844</div>
  <div class="device"><iframe title="Orientador Tech en móvil" src="/" loading="eager"></iframe></div>
</body>
</html>
